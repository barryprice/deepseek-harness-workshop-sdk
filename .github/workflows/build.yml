name: Build SDK
permissions: {}

on:
  pull_request:
    branches:
      - latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: canonical/sdkcraft-actions/.github/workflows/build.yml@4c598a2d8f7b6abd283eba15ec7a9fda8ba76318 # main
    with:
      runs-on: '["ubuntu-latest"]'
