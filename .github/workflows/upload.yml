name: Build and Upload SDK
permissions: {}

on:
  push:
    branches:
      - latest
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., latest)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@edbbef4be311aa1a21442412e2477e1b98cf5c84 # main
    with:
      platforms: '["amd64"]'
      platform-flag: "--build-for"
      runs-on: '["ubuntu-latest"]'
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
